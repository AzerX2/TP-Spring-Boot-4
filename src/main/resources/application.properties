spring.application.name=coffee-hexa-simple
# Profil utilisé quand aucun n'est indiqué (./mvnw spring-boot:run) ; la production démarre avec un profil explicite
spring.profiles.default=dev

# Persistance : Flyway possède le schéma, Hibernate vérifie seulement le mapping
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Web : erreurs RFC 9457 et versionnement d'API par en-tête (Spring Framework 7)
spring.mvc.problemdetails.enabled=true
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1

# Java 25 : traiter les requêtes sur des threads virtuels
spring.threads.virtual.enabled=true

# La documentation d'API s'active par profil
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
