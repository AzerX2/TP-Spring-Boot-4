# Base en mémoire avec un nom fixe pour que la console H2 puisse s'y connecter
spring.datasource.url=jdbc:h2:mem:coffee
spring.h2.console.enabled=true

# Les données de démonstration ne sont chargées qu'en dev
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Traces SQL via le logger plutôt que spring.jpa.show-sql
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
